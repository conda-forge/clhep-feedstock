bot:
  automerge: true
  # Geant4 10.7 requires CLHEP 2.4.4.0 and pins its consumers to it exactly, so
  # that release line has to keep receiving global pinning migrations.
  abi_migration_branches:
    - v2.4.4.0
build_platform:
  linux_aarch64: linux_aarch64
  osx_arm64: osx_arm64
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_aarch64: default
  osx_arm64: default
conda_build:
  pkg_format: '2'
test: native_and_emulated
conda_build_tool: rattler-build
conda_install_tool: pixi
